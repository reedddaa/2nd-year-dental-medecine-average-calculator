<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Complet sur la Physiologie Cardiaque</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            direction: ltr;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .progress-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #4CAF50;
            width: 0%;
            transition: width 0.3s ease;
        }

        .content {
            padding: 40px;
        }

        .question-container {
            display: none;
            animation: slideIn 0.3s ease;
        }

        .question-container.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-number {
            color: #667eea;
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .question-text {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 25px;
            font-weight: 600;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            background: white;
        }

        .option:hover:not(.disabled) {
            border-color: #667eea;
            background: #f5f5ff;
            transform: translateX(5px);
        }

        .option input[type="checkbox"],
        .option input[type="radio"] {
            margin-right: 15px;
            cursor: pointer;
            width: 20px;
            height: 20px;
        }

        .option label {
            cursor: pointer;
            flex: 1;
            margin: 0;
        }

        .option.correct {
            border-color: #4CAF50;
            background: #e8f5e9;
        }

        .option.incorrect {
            border-color: #f44336;
            background: #ffebee;
        }

        .option.disabled {
            pointer-events: none;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 1.1em;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #e8f5e9;
            color: #2e7d32;
            border-left: 5px solid #4CAF50;
        }

        .feedback.incorrect {
            background: #ffebee;
            color: #c62828;
            border-left: 5px solid #f44336;
        }

        .feedback-message {
            margin-bottom: 10px;
            font-weight: 600;
        }

        .correct-answer {
            margin-top: 10px;
            padding: 10px;
            background: rgba(76, 175, 80, 0.1);
            border-radius: 5px;
            font-size: 0.95em;
        }

        .check-button {
            margin-top: 25px;
            padding: 12px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .check-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .check-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 15px;
        }

        .nav-button {
            padding: 10px 20px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .nav-button:hover:not(:disabled) {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .nav-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results-container {
            display: none;
            text-align: center;
            animation: slideIn 0.3s ease;
        }

        .results-container.show {
            display: block;
        }

        .score-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px auto;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .score-text {
            color: white;
            font-size: 3em;
            font-weight: bold;
        }

        .score-label {
            color: white;
            font-size: 1.1em;
            margin-top: 10px;
        }

        .results-message {
            font-size: 1.5em;
            color: #333;
            margin: 20px 0;
            font-weight: 600;
        }

        .results-details {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .detail-item {
            display: flex;
            justify-content: center;
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
            font-size: 1.1em;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .restart-button {
            margin-top: 30px;
            padding: 15px 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .restart-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .question-counter {
            color: #999;
            font-size: 0.9em;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .content {
                padding: 20px;
            }

            .question-text {
                font-size: 1.1em;
            }

            .score-circle {
                width: 150px;
                height: 150px;
            }

            .score-text {
                font-size: 2.2em;
            }
        }
    </style>
</head>

                    "L'onde a, l'onde c, l'onde v",
                    "L'onde x, l'onde y, l'onde z",
                    "L'onde alpha, l'onde bêta, l'onde gamma"
                ],
                correctAnswers: [1],
                type: "single"
            },
            {
                id: 38,
                text: "Quel est le rôle de l'onde (a) dans la courbe de pression auriculaire?",
                options: [
                    "Représente l'ouverture de la valve aortique",
                    "Représente la contraction auriculaire",
                    "Représente la fermeture de la valve mitrale",
                    "Représente le remplissage de l'oreillette par les veines"
                ],
                correctAnswers: [1],
                type: "single"
            },
            {
                id: 39,
                text: "Quel est l'effet de la propriété élastique de l'aorte (effet Windkessel) sur la circulation?",
                options: [
                    "Augmente la vitesse du flux sanguin",
                    "Réduit la pression artérielle",
                    "Convertit la circulation pulsatile en circulation régulière",
                    "Augmente le volume sanguin"
                ],
                correctAnswers: [2],
                type: "single"
            },
            {
                id: 40,
                text: "Quelle est l'importance de l'étude du cycle cardiaque dans la pratique médicale? (Choisissez toutes les réponses correctes)",
                options: [
                    "Aide à diagnostiquer les maladies cardiaques",
                    "Aide à suivre les patients",
                    "Aide à comprendre les mécanismes des maladies",
                    "Aide à déterminer le type d'aliment approprié"
                ],
                correctAnswers: [0, 1, 2],
                type: "multiple"
            }
        ];

        let currentQuestion = 0;
        let userAnswers = [];
        let score = 0;

        function initQuiz() {
            userAnswers = new Array(questions.length).fill(null).map(() => []);
            renderQuestion();
        }

        function renderQuestion() {
            const question = questions[currentQuestion];
            const container = document.getElementById('questionsArea');
            
            let optionsHTML = '';
            const inputType = question.type === 'single' ? 'radio' : 'checkbox';
            const inputName = `question-${currentQuestion}`;

            question.options.forEach((option, index) => {
                const isChecked = userAnswers[currentQuestion].includes(index) ? 'checked' : '';
                optionsHTML += `
                    <label class="option">
                        <input type="${inputType}" name="${inputName}" value="${index}" ${isChecked} onchange="handleOptionChange(${currentQuestion}, ${index}, this.type === 'checkbox')">
                        <span>${option}</span>
                    </label>
                `;
            });

            const progressPercent = ((currentQuestion + 1) / questions.length) * 100;
            document.querySelector('.progress-fill').style.width = progressPercent + '%';

            container.innerHTML = `
                <div class="question-container active">
                    <div class="question-number">Question ${currentQuestion + 1} sur ${questions.length}</div>
                    <div class="question-text">${question.text}</div>
                    <div class="options">${optionsHTML}</div>
                    <div class="feedback" id="feedback-${currentQuestion}"></div>
                    <button class="check-button" onclick="checkAnswer(${currentQuestion})">Vérifier la réponse</button>
                    <div class="navigation">
                        <button class="nav-button" onclick="previousQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>Question Précédente</button>
                        <button class="nav-button" onclick="nextQuestion()" ${currentQuestion === questions.length - 1 ? 'disabled' : ''}>Question Suivante</button>
                    </div>
                    <div class="question-counter">${currentQuestion + 1} / ${questions.length}</div>
                </div>
            `;
        }

        function handleOptionChange(questionIndex, optionIndex, isCheckbox) {
            const question = questions[questionIndex];
            if (isCheckbox) {
                if (userAnswers[questionIndex].includes(optionIndex)) {
                    userAnswers[questionIndex] = userAnswers[questionIndex].filter(i => i !== optionIndex);
                } else {
                    userAnswers[questionIndex].push(optionIndex);
                }
            } else {
                userAnswers[questionIndex] = [optionIndex];
            }
        }

        function checkAnswer(questionIndex) {
            const question = questions[questionIndex];
            const userAnswer = userAnswers[questionIndex];
            const feedback = document.getElementById(`feedback-${questionIndex}`);
            
            // Disable all options after checking
            const options = document.querySelectorAll(`input[name="question-${questionIndex}"]`);
            options.forEach(option => {
                option.parentElement.classList.add('disabled');
            });

            // Check if answer is correct
            const isCorrect = userAnswer.length === question.correctAnswers.length &&
                            userAnswer.every(ans => question.correctAnswers.includes(ans));

            if (isCorrect) {
                score += 0.5;
                feedback.className = 'feedback show correct';
                feedback.innerHTML = `
                    <div class="feedback-message">✓ Réponse correcte! Excellent!</div>
                    <div class="correct-answer">Réponse correcte: ${question.correctAnswers.map(i => question.options[i]).join(' et ')}</div>
                `;
                userAnswer.forEach(ans => {
                    document.querySelector(`input[name="question-${questionIndex}"][value="${ans}"]`).parentElement.classList.add('correct');
                });
            } else {
                feedback.className = 'feedback show incorrect';
                const correctAnswersText = question.correctAnswers.map(i => question.options[i]).join(' et ');
                feedback.innerHTML = `
                    <div class="feedback-message">✗ Réponse incorrecte. Essayez à nouveau!</div>
                    <div class="correct-answer">Réponse correcte: ${correctAnswersText}</div>
                `;
                userAnswer.forEach(ans => {
                    document.querySelector(`input[name="question-${questionIndex}"][value="${ans}"]`).parentElement.classList.add('incorrect');
                });
                question.correctAnswers.forEach(ans => {
                    if (!userAnswer.includes(ans)) {
                        document.querySelector(`input[name="question-${questionIndex}"][value="${ans}"]`).parentElement.classList.add('correct');
                    }
                });
            }

            // Disable check button
            event.target.disabled = true;
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function showResults() {
            document.getElementById('questionsArea').innerHTML = '';
            document.querySelector('.progress-fill').style.width = '100%';
            
            const totalQuestions = questions.length;
            const correctCount = Math.round(score);
            const wrongCount = totalQuestions - correctCount;
            const percentage = Math.round((score / totalQuestions) * 100);
            const finalScore = (score / totalQuestions) * 20;

            let message = '';
            if (finalScore >= 18) {
                message = 'Performance excellente! Vous êtes un expert! 🌟';
            } else if (finalScore >= 15) {
                message = 'Performance excellente! Continuez à vous améliorer! 🎯';
            } else if (finalScore >= 12) {
                message = 'Très bonne performance! Vous pouvez faire mieux. 💪';
            } else if (finalScore >= 10) {
                message = 'Bonne performance! Concentrez-vous sur les points faibles. 📚';
            } else if (finalScore >= 7) {
                message = 'Performance moyenne. Étudiez davantage et réessayez! 📖';
            } else {
                message = 'Performance faible. Concentrez-vous sur l\'étude! 💡';
            }

            document.getElementById('resultsContainer').classList.add('show');
            document.getElementById('finalScore').textContent = finalScore.toFixed(1);
            document.getElementById('resultMessage').textContent = message;
            document.getElementById('correctCount').textContent = `Réponses correctes: ${correctCount} sur ${totalQuestions}`;
            document.getElementById('wrongCount').textContent = `Réponses incorrectes: ${wrongCount} sur ${totalQuestions}`;
            document.getElementById('percentage').textContent = `Pourcentage: ${percentage}%`;
        }

        // Initialize quiz on page load
        window.addEventListener('DOMContentLoaded', initQuiz);
    </script>
</body>
</html>
